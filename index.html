<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Virtuel Multijoueur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .tab-btn.active { border-b-2 border-indigo-500 text-indigo-400 font-bold; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <i class="fa-solid font-bold text-2xl text-yellow-400 fa-dice"></i>
      <h1 class="text-xl font-bold bg-gradient-to-r from-yellow-400 to-amber-500 bg-clip-text text-transparent">
        Casino Multi
      </h1>
    </div>

    <!-- Infos Joueur & Solde -->
    <div class="flex items-center space-x-6">
      <div class="text-right">
        <div class="text-xs text-slate-400">Joueur : <span id="usernameDisplay" class="font-bold text-slate-200">Invité</span></div>
        <div class="text-xl font-black text-emerald-400">$<span id="balanceDisplay">10.00</span></div>
      </div>
      <button id="authBtn" onclick="openAuthModal()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
        Compte / Connexion
      </button>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL + CHAT SIDEBAR -->
  <div class="flex-1 flex flex-col lg:flex-row gap-4 p-4 max-w-7xl mx-auto w-full">
    
    <!-- NAVIGATION & JEUX -->
    <main class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl p-4 flex flex-col">
      <!-- Tabs -->
      <nav class="flex border-b border-slate-800 mb-4 overflow-x-auto space-x-4">
        <button onclick="switchTab('clicker')" id="tab-clicker" class="tab-btn active px-3 py-2 text-sm">⚡ Clicker</button>
        <button onclick="switchTab('crash')" id="tab-crash" class="tab-btn px-3 py-2 text-sm">🚀 Crash</button>
        <button onclick="switchTab('mines')" id="tab-mines" class="tab-btn px-3 py-2 text-sm">💣 Mines</button>
      </nav>

      <!-- TAB CLICKER -->
      <section id="sec-clicker" class="flex-1 flex flex-col items-center justify-center py-6">
        <button id="clickerBtn" onclick="handleClick()" class="w-40 h-40 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 hover:scale-105 active:scale-95 transition flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-hand-pointer text-5xl text-white"></i>
        </button>
        <p class="mt-4 text-sm text-slate-400">+<span id="clickPowerDisplay">0.10</span>$ par clic</p>
      </section>

      <!-- TAB CRASH -->
      <section id="sec-crash" class="hidden flex-1 flex flex-col items-center justify-center">
        <div class="w-full max-w-lg bg-slate-950 p-6 rounded-xl border border-slate-800 text-center">
          <div id="crashMulti" class="text-5xl font-black text-amber-400 mb-6">1.00x</div>
          <div class="flex gap-2 justify-center mb-4">
            <input id="crashBet" type="number" value="1" min="0.1" step="0.5" class="bg-slate-900 border border-slate-700 px-3 py-2 rounded w-32 text-center text-white">
            <button onclick="playCrash()" id="crashBtn" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded font-bold">Miser</button>
          </div>
        </div>
      </section>

      <!-- TAB MINES -->
      <section id="sec-mines" class="hidden flex-1 flex flex-col items-center justify-center">
        <div class="text-center mb-4">
          <p class="text-sm text-slate-400">Grille Démineur 5x5</p>
        </div>
        <div id="minesGrid" class="grid grid-cols-5 gap-2 w-64 h-64 mb-4"></div>
        <button onclick="initMines()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded text-sm font-bold">Nouvelle Partie</button>
      </section>
    </main>

    <!-- SIDEBAR MULTIJOUEUR (CHAT & ENVOI D'ARGENT) -->
    <aside class="w-full lg:w-80 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col h-[500px] lg:h-auto">
      <h2 class="text-md font-bold mb-3 flex items-center gap-2 border-b border-slate-800 pb-2">
        <i class="fa-solid fa-comments text-indigo-400"></i> Tchat En Direct
      </h2>

      <!-- Zone des messages -->
      <div id="chatBox" class="flex-1 overflow-y-auto custom-scroll space-y-2 mb-3 text-xs pr-1"></div>

      <!-- Envoi de message -->
      <div class="flex gap-2 mb-3">
        <input id="chatInput" type="text" placeholder="Votre message..." class="flex-1 bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
        <button onclick="sendChat()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-xs font-bold"><i class="fa-solid fa-paper-plane"></i></button>
      </div>

      <!-- Donner de l'argent -->
      <div class="border-t border-slate-800 pt-3">
        <span class="text-xs font-semibold text-slate-400 block mb-2">🎁 Donner de l'argent</span>
        <div class="flex gap-2">
          <input id="giveUser" type="text" placeholder="Pseudo" class="w-1/2 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-white">
          <input id="giveAmount" type="number" placeholder="Montant" class="w-1/2 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-white">
        </div>
        <button onclick="sendMoney()" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 py-1 rounded text-xs font-bold">Envoyer</button>
      </div>
    </aside>
  </div>

  <!-- SCRIPT JAVASCRIPT & SOCKET.IO -->
  <script>
    // ⚠️ REMPLACEZ PAR VOTRE URL RENDER
    const RENDER_URL = "https://VOTRE-SERVEUR.onrender.com"; 
    
    let socket;
    let state = {
      username: "Joueur_" + Math.floor(Math.random() * 8999 + 1000),
      balance: 10.00,
      clickPower: 0.10
    };

    // Initialisation Socket.io
    try {
      socket = io(RENDER_URL);
      socket.on('connect', () => {
        socket.emit('user_join', { username: state.username, balance: state.balance });
      });

      socket.on('chat_message', (data) => {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        if (data.system) {
          msgDiv.className = "text-amber-400 italic text-[11px]";
          msgDiv.innerText = `[Système] ${data.text}`;
        } else {
          msgDiv.innerHTML = `<b class="text-indigo-400">${data.username}:</b> ${data.text}`;
        }
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      socket.on('receive_money', (data) => {
        state.balance += parseFloat(data.amount);
        updateUI();
        alert(`🎁 Vous avez reçu $${data.amount} de ${data.from} !`);
      });
    } catch(e) {
      console.log("Erreur connexion serveur:", e);
    }

    function updateUI() {
      document.getElementById('balanceDisplay').innerText = state.balance.toFixed(2);
      document.getElementById('usernameDisplay').innerText = state.username;
      document.getElementById('clickPowerDisplay').innerText = state.clickPower.toFixed(2);
    }

    function handleClick() {
      state.balance += state.clickPower;
      updateUI();
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      if (input.value.trim() !== '' && socket) {
        socket.emit('send_message', input.value);
        input.value = '';
      }
    }

    function sendMoney() {
      const target = document.getElementById('giveUser').value.trim();
      const amount = parseFloat(document.getElementById('giveAmount').value);
      if (!target || isNaN(amount) || amount <= 0) return alert("Saisie invalide");
      if (amount > state.balance) return alert("Solde insuffisant");

      state.balance -= amount;
      updateUI();
      if (socket) {
        socket.emit('send_money', { targetUser: target, amount: amount });
      }
    }

    function switchTab(tab) {
      ['clicker', 'crash', 'mines'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('active');
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    // Initialiser les Mines
    function initMines() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const btn = document.createElement('button');
        btn.className = "bg-slate-800 hover:bg-slate-700 rounded transition font-bold text-xs";
        btn.onclick = () => btn.innerText = Math.random() < 0.2 ? '💣' : '💎';
        grid.appendChild(btn);
      }
    }

    initMines();
    updateUI();
  </script>
</body>
</html>
