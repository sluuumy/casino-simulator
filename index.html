<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Virtuel Multijoueur - Animé</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
    .tab-btn.active { border-b-2 border-indigo-500 text-indigo-400 font-bold; background: rgba(99, 102, 241, 0.1); }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    /* Animations dynamiques sur-mesure */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
      50% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.8); }
    }
    .clicker-btn {
      animation: pulse-glow 3s infinite ease-in-out;
    }
    .clicker-btn:active {
      transform: scale(0.92) rotate(-3deg);
    }
    
    /* Texte flottant au clic (+0.10$) */
    .floating-text {
      position: absolute;
      font-weight: 800;
      color: #10b981;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 50;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    /* Animation de carte Mines */
    .mine-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mine-card:hover {
      transform: translateY(-2px) scale(1.05);
    }
    .mine-card.revealed {
      animation: flipInX 0.4s ease-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-40 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <i class="fa-solid font-bold text-2xl text-yellow-400 fa-dice animate-bounce"></i>
      <h1 class="text-2xl font-black bg-gradient-to-r from-yellow-400 via-amber-300 to-yellow-500 bg-clip-text text-transparent">
        Casino Multi
      </h1>
    </div>

    <!-- Infos Joueur & Solde -->
    <div class="flex items-center space-x-6">
      <div class="text-right">
        <div class="text-xs text-slate-400">Joueur : <span id="usernameDisplay" class="font-bold text-indigo-300">Invité</span></div>
        <div class="text-2xl font-black text-emerald-400 flex items-center justify-end gap-1">
          <span>$</span><span id="balanceDisplay">10.00</span>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL + SIDEBAR -->
  <div class="flex-1 flex flex-col lg:flex-row gap-6 p-4 max-w-7xl mx-auto w-full">
    
    <!-- NAVIGATION & JEUX -->
    <main class="flex-1 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 flex flex-col shadow-2xl backdrop-blur-sm">
      
      <!-- Tabs Nav -->
      <nav class="flex border-b border-slate-800 mb-6 overflow-x-auto space-x-2 pb-1">
        <button onclick="switchTab('clicker')" id="tab-clicker" class="tab-btn active px-4 py-2 rounded-t-lg text-sm transition-all duration-200 flex items-center gap-2">
          <i class="fa-solid fa-bolt text-yellow-400"></i> Clicker
        </button>
        <button onclick="switchTab('crash')" id="tab-crash" class="tab-btn px-4 py-2 rounded-t-lg text-sm transition-all duration-200 flex items-center gap-2">
          <i class="fa-solid fa-rocket text-indigo-400"></i> Crash (Aviateur)
        </button>
        <button onclick="switchTab('mines')" id="tab-mines" class="tab-btn px-4 py-2 rounded-t-lg text-sm transition-all duration-200 flex items-center gap-2">
          <i class="fa-solid fa-bomb text-red-400"></i> Démineur
        </button>
      </nav>

      <!-- TAB CLICKER -->
      <section id="sec-clicker" class="flex-1 flex flex-col items-center justify-center py-10 relative">
        <div id="clickerArea" class="relative">
          <button id="clickerBtn" onclick="handleClick(event)" class="clicker-btn w-44 h-44 rounded-full bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 hover:scale-105 transition-transform duration-150 flex flex-col items-center justify-center shadow-2xl text-white">
            <i class="fa-solid fa-hand-pointer text-5xl mb-2 animate-pulse"></i>
            <span class="font-bold text-xs uppercase tracking-wider">Cliquer !</span>
          </button>
        </div>
        <p class="mt-6 text-sm text-slate-400 font-semibold bg-slate-800/60 px-4 py-2 rounded-full border border-slate-700/50">
          ⚡ Gain : <span class="text-emerald-400 font-bold">+<span id="clickPowerDisplay">0.10</span>$</span> par clic
        </p>
      </section>

      <!-- TAB CRASH -->
      <section id="sec-crash" class="hidden flex-1 flex flex-col items-center justify-center py-6">
        <div class="w-full max-w-lg bg-slate-950/80 p-8 rounded-2xl border border-slate-800/80 text-center shadow-inner relative overflow-hidden">
          <div id="crashRocket" class="text-4xl mb-4 transition-all duration-300">🚀</div>
          <div id="crashMulti" class="text-6xl font-black text-amber-400 mb-6 tracking-tight">1.00x</div>
          
          <div id="crashStatus" class="h-6 text-sm font-semibold text-slate-400 mb-4">Prêt à décoller ?</div>
          
          <div class="flex gap-3 justify-center items-center">
            <input id="crashBet" type="number" value="1.00" min="0.1" step="0.5" class="bg-slate-900 border border-slate-700 px-4 py-2.5 rounded-xl w-36 text-center text-white font-bold focus:outline-none focus:border-indigo-500">
            <button onclick="playCrash()" id="crashBtn" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 px-8 py-2.5 rounded-xl font-bold transition shadow-lg shadow
